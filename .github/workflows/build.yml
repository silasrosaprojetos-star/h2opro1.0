name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Remove o Ant do caminho para impedir que o Buildozer o encontre
      PATH: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.19-10/x64/bin:/opt/hostedtoolcache/Python/3.11.15/x64/bin:/usr/local/bin:/usr/bin:/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "Cython==0.29.33" buildozer virtualenv

      - name: Build with Buildozer
        run: |
          rm -rf .buildozer
          # Executa sem o pipe 'yes' para evitar o erro de Broken Pipe
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: H2O-Pro-APK
          path: bin/*.apk
