name: Build Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer virtualenv

      - name: Build with Buildozer
        run: |
          rm -rf .buildozer
          export GRADLE_OPTS="-Dorg.gradle.daemon=false"
          # O timeout de 1200s (20 min) evita encerramento precoce
          timeout 1200s buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: H2O-Pro-APK
          path: bin/*.apk
