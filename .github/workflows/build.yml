name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Remove Obsolete Tools
        run: |
          # Remove o Ant para forçar o Buildozer a usar o Gradle
          sudo rm -rf /home/runner/.buildozer/android/platform/apache-ant* || true

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "Cython==0.29.33" buildozer virtualenv

      - name: Build with Buildozer
        run: |
          rm -rf .buildozer
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: H2O-Pro-APK
          path: bin/*.apk
